# Apache sebagai pintu depan TTX Live.
#
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers
#   sudo cp deploy/ttx-live.conf /etc/apache2/sites-available/ttx-live.conf
#   sudo a2dissite 000-default
#   sudo a2ensite ttx-live
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#
# Apache tidak menjalankan aplikasinya. Node yang berjalan di 127.0.0.1:3000
# lewat systemd, dan berkas ini hanya meneruskan ke sana.

<VirtualHost *:80>
    # Isi dengan IP publik VM, atau nama host kalau nanti punya.
    ServerName GANTI_DENGAN_IP_ATAU_HOSTNAME

    ProxyRequests Off
    ProxyPreserveHost On

    # Urutan ini penting dan tidak boleh dibalik. /ws harus didahulukan,
    # karena ProxyPass mencocokkan dari atas. Kalau aturan "/" di bawah
    # ditaruh lebih dulu, permintaan upgrade WebSocket ikut jalur HTTP biasa,
    # halaman tetap terbuka, tapi ruangan tidak pernah tersambung dan layar
    # peserta berhenti di "Menyambung ulang".
    ProxyPass        /ws  ws://127.0.0.1:3000/ws  retry=0
    ProxyPassReverse /ws  ws://127.0.0.1:3000/ws

    ProxyPass        /    http://127.0.0.1:3000/  retry=0
    ProxyPassReverse /    http://127.0.0.1:3000/

    # Latihan berjalan dua sampai tiga jam dan socketnya menganggur di antara
    # inject. Default Apache memutus lebih cepat dari itu.
    ProxyTimeout 3600

    # Aplikasinya sendiri tidak memuat apa pun dari luar.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog  ${APACHE_LOG_DIR}/ttx-live-error.log
    CustomLog ${APACHE_LOG_DIR}/ttx-live-access.log combined
</VirtualHost>

# ----------------------------------------------------------------------
# Kalau nanti ada nama host, bukan cuma IP, jalankan:
#
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d nama-host-anda
#
# Certbot menulis sendiri blok <VirtualHost *:443> dan mengalihkan 80 ke 443.
# Aturan ProxyPass di atas disalin apa adanya ke blok itu, dan klien otomatis
# berpindah ke wss:// karena halamannya sudah https. Tidak ada kode yang
# perlu diubah.
# ----------------------------------------------------------------------
