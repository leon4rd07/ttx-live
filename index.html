<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FFC600" />
    <title>Tabletop Exercise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <!-- Stamp the saved theme before first paint, so a dark room doesn't get a
         white flash on the way in. -->
    <script>
      try {
        var t = localStorage.getItem("ttx:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #F5F3EC; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #141310; }
      }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #141310; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
